<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Composition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a1a;
      font-family: Inter, sans-serif;
    }
    #grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.3;
      background:
        linear-gradient(90deg, transparent calc(100% - 1px), #3a3a7a 0) 0 0 / 120px 100%,
        linear-gradient(0deg, transparent calc(100% - 1px), #3a3a7a 0) 0 0 / 100% 120px;
    }
    #copy-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 0 150px;
      opacity: 0;
      pointer-events: none;
    }
    #copy-layer h1 {
      margin: 0;
      width: 1300px;
      font-size: 88px;
      line-height: 1.05;
      font-weight: 700;
      text-align: center;
      color: #e8e8ff;
    }
    #copy-layer .accent {
      color: #7c6fff;
    }
    #sub {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: end center;
      padding: 0 150px 120px;
      opacity: 0;
      pointer-events: none;
    }
    #sub p {
      margin: 0;
      font-family: Montserrat, sans-serif;
      font-size: 36px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(232,232,255,0.55);
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="test" data-width="1920" data-height="1080" data-start="0" data-duration="6" data-root="true">
    <div id="grid"></div>
    <div id="copy-layer">
      <h1>Agents that <span class="accent">think.</span><br>Infrastructure that <span class="accent">runs.</span></h1>
    </div>
    <div id="sub">
      <p>Built by Zero &mdash; HyperFrames</p>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      const tl = gsap.timeline({ paused: true });
      tl.to('#copy-layer', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.2);
      tl.to('#sub',        { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.9);
      window.__timelines['test'] = tl;
    })();
  </script>
</body>
</html>
